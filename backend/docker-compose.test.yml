version: '3'
services:

  mongodb-test:
    build: ../mongodb
    image: pwndoc-ng/pwndoc-ng:mongodb
    container_name: mongo-pwndoc-ng-test
    volumes:
      - ./mongo-data-test:/data/db
    restart: always
    environment:
      - MONGO_DB:pwndoc-ng

  backend-test:
    image: yeln4ts/pwndoc-ng:backend-test
    build: 
      context: .
      dockerfile:  Dockerfile.test
    container_name: pwndoc-ng-backend-test
    volumes:
      - ./tests:/app/tests
      - ./src:/app/src
      - ./jest.config.js:/app/jest.config.js
    environment:
      API_URL: https://localhost:4242
    depends_on:
      - mongodb-test
    # Network of the test database: 127.0.0.1:27017 (database of the tests, emptied at the start) is never the
    # database of a running instance (the docker-compose files publish 127.0.0.1:27017 on the host)
    network_mode: service:mongodb-test

volumes:
  mongo-data-test:
