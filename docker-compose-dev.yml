version: '3'
services:

  mongodb:
    # MongoDB 8, data of MongoDB 4.x installations migrated at the first start (see mongodb/README.md)
    build: ./mongodb
    image: pwndoc-ng/pwndoc-ng:mongodb
    container_name: mongo-pwndoc-ng
    healthcheck:
      # mongosh history out of the data volume
      test: ["CMD-SHELL", "HOME=/tmp mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok' | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30m # first start after an update: migration of the data to MongoDB 8
    volumes:
      # Data on the host, in mongodb/mongo-data
      - ./mongodb/mongo-data:/data/db
      # Docker volume of the installations made before: copied once into mongodb/mongo-data when it is empty
      # (see mongodb/README.md), left unchanged. This line can be removed once the copy is checked.
      - mongo-data-dev:/data/previous-volume
    ports:
      - 127.0.0.1:27017:27017
    restart: always
    environment:
      - MONGO_DB:pwndoc

  backend:
    build:
      context: ./backend/
      dockerfile: Dockerfile.dev
    container_name: pwndoc-ng-backend
    entrypoint: ""
    working_dir: "/app"
    command: "npm run dev"
    volumes:
      - ./backend/src/:/app/src/
      - ./backend/report-templates/:/app/report-templates/
      - ./backend/backup/:/app/backup/
      - ./backend/ssl/:/app/ssl/
      - ./backend/tests/:/app/tests/
      - ./backend/package.json:/app/package.json
      - ./backend/package-lock.json:/app/package-lock.json
      - ./backend/swagger.js:/app/swagger.js
    # JWT secrets (32 characters at least, different): when set, they are not generated nor written in
    # backend/src/config/config.json (see docs/installation.md)
    # environment:
    #   - JWT_SECRET=change-me-with-a-random-value
    #   - JWT_REFRESH_SECRET=change-me-with-another-random-value
    depends_on:
      - mongodb
    restart: always
    links:
      - mongodb

  frontend-app:
    build:
      context: ./frontend/
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/ssl:/app/ssl
      - ./frontend/public:/app/public
      - ./frontend/.postcssrc.js:/app/.postcssrc.js
      - ./frontend/babel.config.js:/app/babel.config.js
      - ./frontend/quasar.config.cjs:/app/quasar.config.cjs
      - ./frontend/index.html:/app/index.html
      - ./frontend/package.json:/app/package.json
      - ./frontend/package-lock.json:/app/package-lock.json
    restart: always
    links:
      - backend

  frontend:
    image: nginx:stable-alpine
    user: root
    volumes:
      - ./frontend/.docker/nginx.dev.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/ssl:/etc/nginx/ssl/
    restart: always
    ports:
      - 8443:8443
    links:
      - frontend-app
      - backend

volumes:
  mongo-data-dev:
