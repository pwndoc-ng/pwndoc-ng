version: '3'
services:
  mongodb:
    # MongoDB 8, data of MongoDB 4.x installations migrated at the first start (see mongodb/README.md)
    build: ./mongodb
    image: pwndoc-ng/pwndoc-ng:mongodb
    container_name: mongo-pwndoc-ng
    healthcheck:
      # mongosh history out of the data volume
      test: ["CMD-SHELL", "HOME=/tmp mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok' | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30m # first start after an update: migration of the data to MongoDB 8
    volumes:
      - mongo-data:/data/db
    restart: always
    ports:
      - 127.0.0.1:27017:27017
    environment:
      - MONGO_DB:pwndoc
    networks:
      - backend

  backend:
    build: ./backend
    image: pwndoc-ng/pwndoc-ng:backend
    container_name: pwndoc-ng-backend
    volumes:
      - ./backend/report-templates:/app/report-templates
      - ./backend/src/config:/app/src/config
    depends_on:
      - mongodb
    environment:
      - COLLAB_WEBSOCKET_PORT=8440
    restart: always
    ports:
      - 4242:4242
    links:
      - mongodb
    networks:
      - backend

  frontend:
    build: ./frontend
    image: pwndoc-ng/pwndoc-ng:frontend
    container_name: pwndoc-ng-frontend
    restart: always
    environment:
      - Java_Xms=512m
      - Java_Xmx=2g
    ports:
      - 8443:8443
    networks:
      - backend
  languagetool:
    image: erikvl87/languagetool
    container_name: pwndoc-ng-languagetool
    restart: always
    networks:
      - backend

volumes:
  mongo-data:

networks:
  backend:
      driver: bridge
