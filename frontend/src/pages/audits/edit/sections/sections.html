<div>
    <breadcrumb
    buttons
    :title="audit?.name ? `${audit.name} (${audit.auditType || 'Audit Type not set'})` : 'Loading...'"
    :state="parentState"
    :approvals="parentApprovals"
  >
    <template #buttons>
      <q-btn
        v-if="frontEndAuditState === AUDIT_VIEW_STATE.EDIT"
        color="positive"
        :label="$t('btn.save') + ' (ctrl+s)'"
        :disable="!loaded"
        no-caps
        @click="updateSection"
      />
    </template>
  </breadcrumb>
  

<div class="row q-col-gutter-md q-pa-md">
    <div class="col-md-10 offset-md-1">
        <q-card>
            <!-- For retrocompatibility, test if section.text exists -->
            <q-card-section v-if="section.text"> 
                <div class="row justify-end"><comment-button :target="commentTargets.text" /></div>
                <basic-editor ref="basiceditor_section" noSync v-model="section.text" :idUnique="textEditorId" :comment-target="commentTargets.text" :editable="frontEndAuditState === AUDIT_VIEW_STATE.EDIT" @ready="textEditorReady" />
            </q-card-section>
            <custom-fields v-else 
            ref="customfields" 
            v-model="section.customFields" 
            :comment-target="commentTargets.base"
            custom-element="QCardSection" 
            no-sync-editor
            :readonly="frontEndAuditState !== AUDIT_VIEW_STATE.EDIT"
            :locale="audit.language"
            />
        </q-card>
    </div>
</div>
</div>
